<style>

.body-page .panel{border-radius:0;background:#f1f6f9;border-top:2px solid #cfdee7}.body-page .panel.dark{background:var(--deep);border:0}

<script>
const pages=[...document.querySelectorAll('.slide')],stage=document.querySelector('#stage'),toc=document.querySelector('#toc');let index=0;
pages.forEach((p,i)=>{p.querySelector('.page').textContent=(i+1)+' / '+pages.length;toc.add(new Option((i+1)+' · '+p.querySelector('h1').textContent,i))});
function resize(){let s=Math.min(innerWidth/1280,Math.max(160,innerHeight-72)/720);stage.style.width=1280*s+'px';stage.style.height=720*s+'px';pages.forEach(p=>p.style.transform='scale('+s+')')}
function show(n){index=Math.max(0,Math.min(pages.length-1,n));pages.forEach((p,i)=>p.classList.toggle('active',i===index));toc.value=index;resize()}
document.querySelector('#prev').onclick=()=>show(index-1);document.querySelector('#next').onclick=()=>show(index+1);toc.onchange=()=>show(+toc.value);document.querySelector('#full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();addEventListener('resize',resize);addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(index+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(index-1)}if(e.key==='Home')show(0);if(e.key==='End')show(pages.length-1)});show(0);document.documentElement.dataset.ready='true';
</script></html>
