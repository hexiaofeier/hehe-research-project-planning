<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540" role="img" aria-labelledby="title desc">
  <title id="title">从客户需求到研究方案、执行日历与报价</title>
  <desc id="desc">先理解客户的业务决定，再设计方法与成果，安排实际日历，测算完整成本，形成对应的计划书、执行方案和对客报价。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#143d52"/><stop offset="1" stop-color="#215c6d"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#63b7bc"/></marker>
  </defs>
  <rect width="1600" height="540" rx="18" fill="url(#bg)"/>
  <g font-family="Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif">
    <text x="60" y="57" font-size="20" letter-spacing="2" fill="#9dcbd5">HEHE RESEARCH PROJECT PLANNING</text>
    <text x="60" y="112" font-size="38" font-weight="700" fill="#ffffff">让需求、方法、时间和价格对应同一套研究方案</text>
    <g fill="#f6fafb">
      <rect x="60" y="160" width="342" height="225" rx="8"/>
      <rect x="440" y="160" width="342" height="225" rx="8"/>
      <rect x="820" y="160" width="342" height="225" rx="8"/>
      <rect x="1200" y="160" width="340" height="225" rx="8"/>
    </g>
    <g stroke="#63b7bc" stroke-width="3" marker-end="url(#arrow)">
      <path d="M407 274H432"/><path d="M787 274H812"/><path d="M1167 274H1192"/>
    </g>
    <g font-size="19" font-weight="700" fill="#288991">
      <text x="85" y="199">01 · 理解客户需求</text>
      <text x="465" y="199">02 · 设计研究方法</text>
      <text x="845" y="199">03 · 安排实际日历</text>
      <text x="1225" y="199">04 · 测算完整报价</text>
    </g>
    <g font-size="25" font-weight="700" fill="#173f58">
      <text x="85" y="247">明确研究要支持的决定</text>
      <text x="465" y="247" font-size="23">说明每项研究如何回答问题</text>
      <text x="845" y="247">按人、任务和时段安排</text>
      <text x="1225" y="247">覆盖成本与合理利润</text>
    </g>
    <g font-size="21" fill="#465f6d">
      <text x="85" y="294">拆分业务目标与具体问题</text><text x="85" y="329">评估研究深度和关键条件</text>
      <text x="465" y="294">配置对象、样本与分析方法</text><text x="465" y="329">形成研究框架和预期成果</text>
      <text x="845" y="294">纳入招募、预试和补访</text><text x="845" y="329">核对人员占用与交付日期</text>
      <text x="1225" y="294">归集人工、运营与直接支出</text><text x="1225" y="329">复核成交利润及不利情景</text>
    </g>
    <path d="M60 423H1540" stroke="#568292" stroke-width="1"/>
    <text x="60" y="477" font-size="24" font-weight="700" fill="#ffffff">完整项目交付</text>
    <text x="293" y="477" font-size="24" fill="#e1eff3">研究计划书</text><text x="507" y="477" font-size="24" fill="#7fc4c8">＋</text>
    <text x="565" y="477" font-size="24" fill="#e1eff3">研究执行方案</text><text x="812" y="477" font-size="24" fill="#7fc4c8">＋</text>
    <text x="870" y="477" font-size="24" fill="#e1eff3">对客报价</text>
    <text x="1158" y="477" font-size="19" fill="#b8d5df">内部成本与利润测算单独保存</text>
  </g>
</svg>
